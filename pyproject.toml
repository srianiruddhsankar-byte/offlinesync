[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/docs.py" = ["E501"]  # long prose strings for the Swagger page

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection helpers are meant to be called in argument defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body", "fastapi.Query", "fastapi.Path"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
